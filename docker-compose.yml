# Local cluster: one metadata controller, four storage workers, and one CLI container.
x-worker-base: &worker-base
  build:
    context: .
    target: worker
  restart: unless-stopped
  stop_grace_period: 10s
  env_file:
    - .env
  depends_on:
    controller:
      condition: service_healthy

# Shared worker settings keep registration and storage behavior consistent.
x-worker-env: &worker-env
  WORKER_LISTEN: ":9000"
  CONTROLLER_URL: http://controller:8080
  DATA_DIR: /data
  HEARTBEAT_INTERVAL: 2s
  SCRUB_INTERVAL: 10m
  SCRUB_RATE_MBPS: "50"
  CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-secret-change-me}

services:
  # The controller owns public APIs, SQLite metadata, placement, and repair.
  controller:
    build:
      context: .
      target: controller
    container_name: controller
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CLUSTER_TOKEN: ${CLUSTER_TOKEN:-dev-secret-change-me}
      LISTEN_ADDR: ":8080"
      DB_PATH: /data/meta.db
      CHUNK_SIZE: "1048576"
      REPLICATION_FACTOR: "2"
      WRITE_ACKS: "2"
      UPLOAD_PARALLELISM: "4"
      MAX_CONCURRENT_UPLOADS: "16"
      MAX_OBJECT_BYTES: "5368709120"
      DOWNLOAD_PREFETCH: "2"
      HEARTBEAT_INTERVAL: 2s
      SUSPECT_AFTER: 6s
      DEAD_AFTER: 15s
      REPAIR_CONCURRENCY: "2"
      REPAIR_DELAY: 5s
      REPAIR_ENABLED: "true"
      STARTUP_GRACE: 10s
      RECONCILE_INTERVAL: 5s
      INVENTORY_SYNC_INTERVAL: 30s
    volumes:
      - controller-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  # Four independent volumes demonstrate replica placement and failure recovery.
  worker1:
    <<: *worker-base
    container_name: worker1
    environment:
      <<: *worker-env
      WORKER_ID: worker1
      WORKER_ADDR: http://worker1:9000
    volumes:
      - worker1-data:/data

  worker2:
    <<: *worker-base
    container_name: worker2
    environment:
      <<: *worker-env
      WORKER_ID: worker2
      WORKER_ADDR: http://worker2:9000
    volumes:
      - worker2-data:/data

  worker3:
    <<: *worker-base
    container_name: worker3
    environment:
      <<: *worker-env
      WORKER_ID: worker3
      WORKER_ADDR: http://worker3:9000
    volumes:
      - worker3-data:/data

  worker4:
    <<: *worker-base
    container_name: worker4
    environment:
      <<: *worker-env
      WORKER_ID: worker4
      WORKER_ADDR: http://worker4:9000
    volumes:
      - worker4-data:/data

  # Optional interactive shell for running the CLI inside the Compose network.
  client:
    build:
      context: .
      target: client
    container_name: client
    entrypoint: ["sleep", "infinity"]
    environment:
      OCS_ENDPOINT: http://controller:8080
      OCS_TOKEN: ${CLUSTER_TOKEN:-dev-secret-change-me}
    depends_on:
      controller:
        condition: service_healthy

volumes:
  # Persistent metadata and worker chunk storage survive container restarts.
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:
